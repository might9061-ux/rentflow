<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Classic .ico first: the file Google Search fetches most reliably. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback: Google Search reads favicons most reliably from a raster image. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- Pinch-zoom off so the installed app behaves like a native one (zooming
         breaks the sticky header, sidebar and lock screen). Users change text
         size in Settings → Appearance instead, which scales the whole UI. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f7" />
    <meta name="description" content="RentLoja — premium property rental management for Africa" />
    <title>RentLoja</title>

    <!-- Canonical + social: pin the site to its https address so search engines
         index the secure URL, not an old http one. -->
    <link rel="canonical" href="https://www.rentloja.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rentloja.com/" />
    <meta property="og:title" content="RentLoja" />
    <meta property="og:description" content="RentLoja — premium property rental management for Africa" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RentLoja" />
    <meta name="twitter:description" content="RentLoja — property rental management for Africa: collect rent, track payments, manage tenants." />

    <!-- Structured data: tells search engines and AI assistants what RentLoja is,
         in a machine-readable form so they can describe it accurately. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.rentloja.com/#org",
          "name": "RentLoja",
          "url": "https://www.rentloja.com/",
          "logo": "https://www.rentloja.com/icon-512.png",
          "description": "RentLoja is property rental management software for Africa — landlords and property managers collect rent, track payments, manage tenants and agents, and issue receipts."
        },
        {
          "@type": "WebSite",
          "@id": "https://www.rentloja.com/#website",
          "url": "https://www.rentloja.com/",
          "name": "RentLoja",
          "publisher": { "@id": "https://www.rentloja.com/#org" }
        },
        {
          "@type": "SoftwareApplication",
          "name": "RentLoja",
          "url": "https://www.rentloja.com/",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, Android, iOS (PWA)",
          "description": "Property rental management for landlords and property managers in Africa: collect rent online (card, EcoCash, InnBucks and more via Pesepay) or record manual payments, track who owes and who's paid ahead, manage tenants and agents, and generate receipts and statements.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "7-day free trial, no charge today"
          },
          "publisher": { "@id": "https://www.rentloja.com/#org" }
        }
      ]
    }
    </script>

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RentLoja" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('rentflow_theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
