# Render.com blueprint for the RentFlow API.
# In Render: New + → Blueprint → connect the repo → it reads this file.
# Set the secret env values (marked sync:false) in the Render dashboard.
services:
  - type: web
    name: rentflow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false          # set in dashboard
      - key: SUPABASE_ANON_KEY
        sync: false          # set in dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # set in dashboard (SECRET)
      - key: CORS_ORIGINS
        sync: false          # set to your deployed frontend URL(s)
