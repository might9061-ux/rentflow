# Render.com blueprint for the RentFlow API (repo root).
# New + -> Blueprint -> connect this repo. Set the secret env values in the dashboard.
services:
  - type: web
    name: rentflow-api
    runtime: node
    plan: free
    # Co-located with the Supabase DB (AWS eu-west-2 / London). Frankfurt is
    # Render's closest region, so API↔DB round-trips stay ~10ms instead of
    # crossing the Atlantic.
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
